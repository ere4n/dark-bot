name: Tuff Bot Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: tuff-bot-runner
  cancel-in-progress: true

jobs:
  run-private-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout Runner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone Repository & Install Packages
        run: |
          git clone https://github.com/ere4n/asituff.git
          pip install --upgrade pip
          pip install python-telegram-bot requests
          if [ -f asituff/requirements.txt ]; then pip install -r asituff/requirements.txt; fi

      - name: Run Bot 24/7
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          cd asituff
          python3 -u "dark tuff.py"

      - name: Auto Restart Every 6 Hours
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: gh workflow run tuff-runner.yml -R ${{ github.repository }}
